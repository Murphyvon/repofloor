<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Repofloor Demo</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #0f1116; color: #e8ebf2; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
      header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid #262a35; }
      header h1 { font-size: 14px; margin: 0; }
      header .pill { padding: 2px 8px; border-radius: 999px; background: #1c2029; color: #9aa3b5; font-size: 11px; }
      main { display: grid; grid-template-columns: 1fr 300px; height: calc(100vh - 45px); }
      #office { position: relative; overflow: hidden; }
      aside { border-left: 1px solid #262a35; padding: 12px; overflow: auto; }
      aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #9aa3b5; margin: 12px 0 6px; }
      .log { font-size: 11px; color: #9aa3b5; }
      .log div { padding: 2px 0; border-bottom: 1px dashed #1f2430; }
      .log b { color: #e8ebf2; }
      button { background: #1c2029; color: #e8ebf2; border: 1px solid #343a48; border-radius: 4px; padding: 4px 8px; font: inherit; cursor: pointer; margin: 2px 2px 2px 0; }
      button:hover { background: #262b37; }
      @media (max-width: 800px) { main { grid-template-columns: 1fr; } aside { display: none; } }
    </style>
  </head>
  <body>
    <header>
      <h1>🏢 repofloor</h1>
      <span class="pill" id="mode">simulated</span>
      <span class="pill" id="clock"></span>
    </header>
    <main>
      <div id="office"></div>
      <aside>
        <h2>Fire an event</h2>
        <div id="controls"></div>
        <h2>Event log</h2>
        <div class="log" id="log"></div>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
