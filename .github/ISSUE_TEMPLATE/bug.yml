name: Bug
description: Something is wrong
labels: [bug]
body:
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
  - type: input
    id: where
    attributes:
      label: Where
      placeholder: "pnpm dev / Lite Pages site of owner/repo / …"
