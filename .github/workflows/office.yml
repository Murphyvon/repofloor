# Dogfooding: publish this repository's own office to GitHub Pages.
# Other repositories copy this file (see docs/LITE.md) and change the `uses:` line.
name: Repofloor office

on:
  push:
    branches: [main]
  # pull_request_target, not pull_request: a run from a PR ref cannot deploy Pages
  # (the token is read-only on forks), so every PR used to carry a failing deploy.
  # This runs in the base branch's context and never checks out or builds PR code —
  # the action it runs is the committed bundle on main.
  pull_request_target:
    types: [opened, closed, reopened, ready_for_review, review_requested]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, closed, assigned]
  issue_comment:
    types: [created] # a conversation is "happening now" too
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "17 * * * *" # hourly, so idle/offline decay stays truthful
  workflow_dispatch:

concurrency:
  # Let a running snapshot finish instead of killing it: a push used to start one,
  # then CI finishing cancelled it ~40s in and started over, so the office appeared
  # ~70s after the push instead of ~30s. GitHub keeps only the newest pending run,
  # so the floor stays current without the restart.
  group: repofloor-office
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
  pull-requests: read
  issues: read

jobs:
  # One job on purpose: a separate deploy job cost another runner pickup (~10s) for
  # three seconds of work, and this page is meant to be as close to live as a
  # serverless setup gets.
  office:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Snapshot office
        uses: ./apps/lite-action # external repos: uses: repofloor/repofloor/apps/lite-action@main
        with:
          hours: 72
          output-dir: repofloor-site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: repofloor-site
      - id: deployment
        uses: actions/deploy-pages@v5
